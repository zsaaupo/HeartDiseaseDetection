{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CardioPredict{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body>

  <nav class="navbar cp-navbar mb-4">
    <div class="container justify-content-center">
      <span class="navbar-brand cp-brand mb-0">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 21s-7.5-4.8-10-9.3C0.3 8.1 2 4.5 5.6 4c2-0.3 3.7 0.7 4.9 2.3l1.5 2 1.5-2C14.7 4.7 16.4 3.7 18.4 4c3.6 0.5 5.3 4.1 3.6 7.7C19.5 16.2 12 21 12 21z" fill="#e2602f"/>
          <polyline points="3.5,12 7,12 9,7.5 12,16 14,10 16,12 20.5,12" fill="none" stroke="#0a2b2b" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        CardioPredict
      </span>
    </div>
  </nav>

  <main class="container pb-5">
    {% block content %}{% endblock %}
  </main>

  <footer class="cp-footer text-center">
    <div class="container">
      CardioPredict &mdash; Clinical decision-support demo. Not a substitute for professional medical advice.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'js/main.js' %}"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
